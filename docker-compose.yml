name: ${CONTAINER_NAME}
services:
    app:
        image: mgazori/php-alpine:latest
        container_name: ${CONTAINER_NAME}_app
        restart: unless-stopped
        tty: true
        user: "${UID}:${GID}"
        environment:
            SERVICE_NAME: ${CONTAINER_NAME}
            SERVICE_TAGS: ${APP_ENV}
            CONTAINER_ROLE: app
        working_dir: /var/www
        links:
            - mysql
        depends_on:
            - mysql
        volumes:
            - ./FreshRSS:/var/www
            # - ./docker/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            # - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - app_network
        healthcheck:
            test: [ "CMD-SHELL", "php -r 'echo \"Health check\";'" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    nginx:
        image: nginx:latest
        container_name: ${CONTAINER_NAME}_nginx
        restart: unless-stopped
        tty: true
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        links:
            - app
        volumes:
            - ./FreshRSS:/var/www
            - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
            - ./ssl:/etc/nginx/ssl
        networks:
            - app_network
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://localhost || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    mysql:
        image: mysql:8.0
        container_name: ${CONTAINER_NAME}_mysql
        restart: unless-stopped
        tty: true
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}_root
            SERVICE_TAGS: ${APP_ENV}
            SERVICE_NAME: ${DB_DATABASE}
        volumes:
            - mysql_volume:/var/lib/mysql/
            - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
        networks:
            - app_network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
            retries: 3
            timeout: 5s

networks:
    app_network:
        driver: bridge
volumes:
    mysql_volume:
        driver: local
