server {
    listen 80;

    root /var/www/p;
    index index.php index.html;
    
    # Error and access logging
    error_log /dev/stderr;
    access_log /var/log/nginx/access.log combined;
    
    # Server tokens off (equivalent to ServerTokens OS)
    server_tokens off;
    
    # Allow encoded slashes
    merge_slashes off;
    
    # Client body size
    client_max_body_size 2048M;
    
    # Remote IP handling
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    
    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type';
    
    # Additional security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Base directory protection
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
    
    # API directory handling
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Authorization header handling
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
    }
    
    # /i directory handling
    location /i/ {
        try_files $uri $uri/ /index.php?$query_string;
        expires off;
    }
    
    # Themes directory handling
    location /themes/ {
        try_files $uri $uri/ /index.php?$query_string;

        # Deny files without extension or with specific extensions
        location ~ ^/themes/[^.]+$ {
            deny all;
        }
        location ~ ^/themes/.*\.(md|scss|sh)$ {
            deny all;
        }

        # MIME types
        types {
            font/woff                           woff;
            font/woff2                          woff2;
            application/json                    json;
            image/gif                           gif;
            image/png                           png;
            image/svg+xml                       svg svgz;
            text/css                            css;
        }

        # Character encoding
        charset utf-8;
        charset_types text/css image/svg+xml;

        # Cache control
        location ~* \.(json)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        location ~* \.(woff|woff2)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        location ~* \.(gif)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        location ~* \.(png)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        location ~* \.(svg)$ {
            expires 1M;
            add_header Cache-Control "public";
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'";
        }

        location ~* \.(css)$ {
            expires 1M;
            add_header Cache-Control "public";
        }
    }
    
    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header access-control-allow-origin;
    }
    
    # Deny access to . files
    location ~ /\. {
        deny all;
    }
}